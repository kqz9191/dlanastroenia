<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>тебее)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Запрет выделения текста */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent; /* Убирает синий фон/подсветку при клике */
            outline: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            cursor: pointer;
            background-color: #000;
        }

        /* Класс для смены фона */
        body.white-bg {
            background-color: #fff;
        }

        /* Основной текст с плавными анимациями */
        #text {
            font-size: clamp(2rem, 8vw, 3rem);
            text-align: center;
            color: #fff;
            mix-blend-mode: difference;
            padding: 15px;
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
            z-index: 2;
            max-width: 95vw;
            opacity: 1;
            filter: blur(0);
            transform: scale(1);
        }

        /* Белый жирный стиль для комплиментов поверх видео */
        .special {
            font-weight: 900 !important;
            font-size: clamp(1.5rem, 6.5vw, 2.5rem) !important;
            text-transform: uppercase;
            color: #ffffff !important;
            mix-blend-mode: normal !important;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* Анимация "испарения" слова в конце */
        .fade-out {
            opacity: 0 !important;
            filter: blur(15px) !important;
            transform: scale(1.3) !important;
        }

        /* Стиль и плавное появление финальной надписи поверх второго видео */
        .final-text {
            font-weight: 900 !important;
            font-size: clamp(1.6rem, 7vw, 2.8rem) !important;
            color: #ffffff !important;
            mix-blend-mode: normal !important;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 15px rgba(0, 0, 0, 0.9);
            opacity: 1 !important;
            filter: blur(0) !important;
            transform: scale(1) !important;
        }

        /* Видео элементы на весь экран */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
            display: none;
            z-index: 1;
            opacity: 1;
            transition: opacity 1s ease; /* Плавное затухание видео */
        }
    </style>
</head>
<body>

    <div id="text">если</div>

    <!-- Аудио плеер (2.mp3) -->
    <audio id="bgMusic" loop autoplay>
        <source src="2.mp3" type="audio/mpeg">
    </audio>

    <!-- Первое видео -->
    <video id="myVideo" loop muted playsinline>
        <source src="1.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <!-- Второе видео (для финального слова) -->
    <video id="myVideo2" loop muted playsinline>
        <source src="2.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <script>
        // Установлено 186 миллисекунд на каждое слово
        const complimentsSpeed = 186;

        // Элементы
        const textElement = document.getElementById('text');
        const videoElement = document.getElementById('myVideo');
        const videoElement2 = document.getElementById('myVideo2');
        const bgMusic = document.getElementById('bgMusic');

        // Запуск музыки при первой возможности
        function tryPlayAudio() {
            if (bgMusic.paused) {
                bgMusic.play().catch(() => {
                    // Блокировка автозапуска браузером — музыка включится при клике
                });
            }
        }
        tryPlayAudio(); // Пробуем включить сразу при загрузке

        // Первоначальный список слов (переключаются по клику)
        const words = [
            "если", "бы", "я", "мог", "подарить", "тебе", "одну", "вещь",
            "я", "бы", "подарил", "тебе", "возможность", "увидеть", "себя",
            "моими", "глазами", "чтобы", "ты", "наконец", "поняла.",
            "какая", "ты", "ОСОБЕННАЯ."
        ];

        // Второй список слов (автоматически пролетают поверх первого видео)
        const compliments = [
            "а особенная потому что",
            "искренняя", "добрая", "нежная", "заботливая", "ласковая", "красивая", 
            "умная", "милая", "очаровательная", "прекрасная", "улыбчивая", 
            "солнечная", "светлая", "лучезарная", "добрая", "честная", "верная", 
            "надежная", "понимающая", "отзывчивая", "чуткая", "терпеливая", 
            "спокойная", "веселая", "жизнерадостная", "позитивная", "вдохновляющая", 
            "уникальная", "неповторимая", "настоящая", "искристая", "душевная", 
            "романтичная", "трогательная", "открытая", "искренняя", "харизматичная", 
            "обаятельная", "привлекательная", "великолепная", "чудесная", "волшебная", 
            "удивительная", "невероятная", "бесценная", "драгоценная", "любимая", 
            "родная", "единственная", "талантливая", "сильная", "смелая", 
            "уверенная", "мудрая", "аккуратная", "внимательная", "заботливая", 
            "искренняя", "добрая", "мягкая", "нежнейшая", "уютная", "теплая", 
            "спокойная", "искрометная", "позитивная", "отзывчивая", "благородная", 
            "сердечная", "великодушная", "искренняя", "терпимая", "воспитанная", 
            "культурная", "естественная", "искренняя", "стильная", "элегантная", 
            "грациозная", "изящная", "обаятельная", "яркая", "сияющая", 
            "мечтательная", "вдохновенная", "волнующая", "притягательная", 
            "сказочная", "чудесная", "идеальная", "незабываемая", "великолепная", 
            "исключительная", "ценная", "любимая", "незаменимая", "дорогая", 
            "восхитительная", "прекраснейшая", "необыкновенная"
        ];

        let currentIndex = 0;
        let isAutomaticPhase = false;

        // Мигание фона каждые 70 миллисекунд
        const flashInterval = setInterval(() => {
            document.body.classList.toggle('white-bg');
        }, 70);

        // Переключение слов по клику
        window.addEventListener('click', () => {
            tryPlayAudio(); // Страховка: если автозапуск был заблокирован, включаем музыку при клике

            if (isAutomaticPhase) return; // Отключаем клики после входа в авто-фазу

            if (currentIndex < words.length - 1) {
                currentIndex++;
                textElement.textContent = words[currentIndex];

                // Когда доходим до слова "ОСОБЕННАЯ."
                if (words[currentIndex] === "ОСОБЕННАЯ.") {
                    isAutomaticPhase = true;

                    // 1. Применяем стиль для текста
                    textElement.classList.add('special');

                    // 2. Останавливаем мигание и делаем фон темным
                    clearInterval(flashInterval);
                    document.body.classList.remove('white-bg');
                    document.body.style.backgroundColor = '#000';

                    // 3. Через 2 секунды запускаем видео 1.mp4 и комплименты
                    setTimeout(() => {
                        videoElement.style.display = 'block';
                        videoElement.play();
                        startCompliments();
                    }, 2000);
                }
            }
        });

        // Функция авто-смены слов (186 мс)
        function startCompliments() {
            let compIndex = 0;
            textElement.textContent = compliments[compIndex];

            // Каждое слово сменяется каждые 186 миллисекунд
            const compInterval = setInterval(() => {
                compIndex++;
                if (compIndex < compliments.length) {
                    textElement.textContent = compliments[compIndex];
                } else {
                    clearInterval(compInterval); // Завершаем смену слов

                    // Задержка на последнем слове, затем испарение текста И первого видео
                    setTimeout(() => {
                        textElement.classList.add('fade-out'); // Текст испаряется
                        videoElement.style.opacity = '0';      // Видео 1 плавно уходит в темноту

                        // Через 1 секунду переключаемся на второе видео 2.mp4
                        setTimeout(() => {
                            // Отключаем видео 1
                            videoElement.style.display = 'none';
                            videoElement.pause();

                            // Запускаем видео 2 (2.mp4)
                            videoElement2.style.display = 'block';
                            videoElement2.style.opacity = '1';
                            videoElement2.play();

                            // Показываем финальную надпись
                            textElement.textContent = "ты котенок в этом мире 🫶";
                            textElement.classList.remove('fade-out');
                            textElement.classList.add('final-text');
                        }, 1000);

                    }, 500);
                }
            }, complimentsSpeed);
        }
    </script>
</body>
</html>
