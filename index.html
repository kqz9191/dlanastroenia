<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Запрет выделения текста */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent; /* Убирает синий фон/подсветку при клике на смартфонах */
            outline: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            cursor: pointer;
            background-color: #000;
        }

        /* Класс для смены фона */
        body.white-bg {
            background-color: #fff;
        }

        /* Основной текст с плавными анимациями */
        #text {
            font-size: clamp(2rem, 8vw, 3rem);
            text-align: center;
            color: #fff;
            mix-blend-mode: difference;
            padding: 15px;
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
            z-index: 2;
            max-width: 95vw;
            opacity: 1;
            filter: blur(0);
            transform: scale(1);
        }

        /* Белый жирный стиль для комплиментов поверх видео */
        .special {
            font-weight: 900 !important;
            font-size: clamp(1.5rem, 6.5vw, 2.5rem) !important;
            text-transform: uppercase;
            color: #ffffff !important;
            mix-blend-mode: normal !important;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* Анимация "испарения" слова в конце */
        .fade-out {
            opacity: 0 !important;
            filter: blur(15px) !important;
            transform: scale(1.3) !important;
        }

        /* Стиль и плавное появление финальной надписи на черном фоне */
        .final-text {
            font-weight: 900 !important;
            font-size: clamp(1.6rem, 7vw, 2.8rem) !important;
            color: #ffffff !important;
            mix-blend-mode: normal !important;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            opacity: 1 !important;
            filter: blur(0) !important;
            transform: scale(1) !important;
        }

        /* Видео на весь экран с возможностью плавного исчезновения */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            pointer-events: none;
            display: none;
            z-index: 1;
            opacity: 1;
            transition: opacity 1s ease; /* Плавное затухание видео */
        }
    </style>
</head>
<body>

    <div id="text">если</div>

    <video id="myVideo" loop muted playsinline>
        <source src="1.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
    </video>

    <script>
        // Первоначальный список слов (переключаются по клику)
        const words = [
            "если", "бы", "я", "мог", "подарить", "тебе", "одну", "вещь",
            "я", "бы", "подарил", "тебе", "возможность", "увидеть", "себя",
            "моими", "глазами", "чтобы", "ты", "наконец", "поняла.",
            "какая", "ты", "ОСОБЕННАЯ."
        ];

        // Второй список слов (автоматически пролетают поверх видео)
        const compliments = [
            "а особенная потому что",
            "искренняя", "добрая", "нежная", "заботливая", "ласковая", "красивая", 
            "умная", "милая", "очаровательная", "прекрасная", "улыбчивая", 
            "солнечная", "светлая", "лучезарная", "добрая", "честная", "верная", 
            "надежная", "понимающая", "отзывчивая", "чуткая", "терпеливая", 
            "спокойная", "веселая", "жизнерадостная", "позитивная", "вдохновляющая", 
            "уникальная", "неповторимая", "настоящая", "искристая", "душевная", 
            "романтичная", "трогательная", "открытая", "искренняя", "харизматичная", 
            "обаятельная", "привлекательная", "великолепная", "чудесная", "волшебная", 
            "удивительная", "невероятная", "бесценная", "драгоценная", "любимая", 
            "родная", "единственная", "талантливая", "сильная", "смелая", 
            "уверенная", "мудрая", "аккуратная", "внимательная", "заботливая", 
            "искренняя", "добрая", "мягкая", "нежнейшая", "уютная", "теплая", 
            "спокойная", "искрометная", "позитивная", "отзывчивая", "благородная", 
            "сердечная", "великодушная", "искренняя", "терпимая", "воспитанная", 
            "культурная", "естественная", "искренняя", "стильная", "элегантная", 
            "грациозная", "изящная", "обаятельная", "яркая", "сияющая", 
            "мечтательная", "вдохновенная", "волнующая", "притягательная", 
            "сказочная", "чудесная", "идеальная", "незабываемая", "великолепная", 
            "исключительная", "ценная", "любимая", "незаменимая", "дорогая", 
            "восхитительная", "прекраснейшая", "необыкновенная"
        ];

        let currentIndex = 0;
        let isAutomaticPhase = false;
        const textElement = document.getElementById('text');
        const videoElement = document.getElementById('myVideo');

        // Мигание фона каждые 70 миллисекунд
        const flashInterval = setInterval(() => {
            document.body.classList.toggle('white-bg');
        }, 70);

        // Переключение слов по клику
        window.addEventListener('click', () => {
            if (isAutomaticPhase) return; // Отключаем клики после входа в авто-фазу

            if (currentIndex < words.length - 1) {
                currentIndex++;
                textElement.textContent = words[currentIndex];

                // Когда доходим до слова "ОСОБЕННАЯ."
                if (words[currentIndex] === "ОСОБЕННАЯ.") {
                    isAutomaticPhase = true;

                    // 1. Применяем стиль для текста
                    textElement.classList.add('special');

                    // 2. Останавливаем мигание и делаем фон темным
                    clearInterval(flashInterval);
                    document.body.classList.remove('white-bg');
                    document.body.style.backgroundColor = '#000';

                    // 3. Через 2 секунды запускаем видео и комплименты
                    setTimeout(() => {
                        videoElement.style.display = 'block';
                        videoElement.play();
                        startCompliments();
                    }, 2000);
                }
            }
        });

        // Функция авто-смены слов (100 мс) и плавной концовки
        function startCompliments() {
            let compIndex = 0;
            textElement.textContent = compliments[compIndex];

            // Каждое слово сменяется каждые 100 мс
            const compInterval = setInterval(() => {
                compIndex++;
                if (compIndex < compliments.length) {
                    textElement.textContent = compliments[compIndex];
                } else {
                    clearInterval(compInterval); // Завершаем смену слов

                    // Задержка на последнем слове, затем испарение текста И видео
                    setTimeout(() => {
                        textElement.classList.add('fade-out'); // Текст испаряется
                        videoElement.style.opacity = '0';      // Видео плавно затухает в черный экран

                        // Через 1 секунду после ухода в темноту выводим финальный текст
                        setTimeout(() => {
                            videoElement.style.display = 'none'; // Полностью отключаем видео
                            videoElement.pause();

                            textElement.textContent = "ты не такая, как думаешь. ты самая лучшая";
                            textElement.classList.remove('fade-out');
                            textElement.classList.add('final-text');
                        }, 1000);

                    }, 500);
                }
            }, 100);
        }
    </script>
</body>
</html>
